name: Build Radhe APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4[cite: 1]

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip build-essential git python3-dev ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev
          sudo apt-get install -y libsqlite3-dev sqlite3 bzip2 libbz2-dev libssl-dev openssl libgdbm-dev libgdbm-compat-dev liblzma-dev libreadline-dev libncursesw5-dev libffi-dev uuid-dev
          sudo apt-get install -y libtool autoconf automake pkg-config libpython3-dev
          pip3 install --user --upgrade buildozer cython virtualenv[cite: 1]

      - name: Build with Buildozer
        run: |
          export PATH=$PATH:$HOME/.local/bin[cite: 1]
          # This automatically accepts all Android licenses to prevent build failures
          yes | buildozer android debug[cite: 1]
        continue-on-error: false

      - name: Upload APK
        uses: actions/upload-artifact@v4[cite: 1]
        with:
          name: Radhe-Installer[cite: 1]
          path: bin/*.apk[cite: 1]
      
